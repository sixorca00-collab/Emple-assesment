<div class="flex h-[calc(100vh-4rem)] w-full bg-light-bg dark:bg-dark-bg text-slate-800 dark:text-slate-100 overflow-hidden select-none">

  <!-- ================= SIDEBAR PLEGABLE (Navbar Slide) ================= -->
  <aside 
    [class.w-72]="isSidebarOpen()" 
    [class.w-16]="!isSidebarOpen()"
    class="bg-light-surface dark:bg-dark-surface border-r border-light-border dark:border-dark-border flex flex-col transition-all duration-300 ease-in-out relative shadow-sm">
    
    <!-- Top Bar del Sidebar + Botón Plegar -->
    <div class="h-14 px-4 flex items-center justify-between border-b border-light-border dark:border-dark-border">
      <div *ngIf="isSidebarOpen()" class="flex items-center space-x-2 truncate">
        <span class="w-2.5 h-2.5 rounded-full bg-accent-400 animate-pulse"></span>
        <h2 class="font-bold text-sm tracking-wide text-brand-600 dark:text-brand-500 uppercase truncate">
          Canales & Chats
        </h2>
      </div>

      <!-- Botón Plegar/Desplegar -->
      <button 
        (click)="toggleSidebar()" 
        class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors focus:outline-none mx-auto"
        [title]="isSidebarOpen() ? 'Colapsar barra' : 'Expandir barra'">
        <svg xmlns="http://www.w3.org/2000/svg" 
             class="h-5 w-5 transition-transform duration-300" 
             [class.rotate-180]="!isSidebarOpen()" 
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <!-- Lista de Canales -->
    <div class="flex-1 overflow-y-auto p-2 space-y-1">
      <div *ngIf="isSidebarOpen()" class="px-3 py-2 text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
        Mensajería
      </div>

      <button 
        *ngFor="let channel of channels"
        (click)="selectChannel(channel)"
        [class.bg-brand-50]="isSidebarOpen() && activeChannel().id === channel.id"
        [class.dark:bg-slate-800]="isSidebarOpen() && activeChannel().id === channel.id"
        [class.border-brand-600]="activeChannel().id === channel.id"
        class="w-full flex items-center space-x-3 p-2.5 rounded-xl border-l-4 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60 transition text-left group">
        
        <!-- Ícono del Canal -->
        <span class="w-8 h-8 rounded-lg bg-brand-100 dark:bg-slate-700 text-brand-600 dark:text-accent-400 flex items-center justify-center font-bold text-sm flex-shrink-0">
          {{ channel.icon }}
        </span>

        <!-- Info del Canal (Visible solo si está desplegado) -->
        <div *ngIf="isSidebarOpen()" class="flex-1 flex items-center justify-between overflow-hidden">
          <span class="text-sm font-medium truncate text-slate-700 dark:text-slate-200 group-hover:text-brand-600 dark:group-hover:text-white">
            {{ channel.name }}
          </span>
          <span *ngIf="channel.unreadCount" class="ml-2 px-2 py-0.5 text-xs font-extrabold bg-accent-500 text-white rounded-full">
            {{ channel.unreadCount }}
          </span>
        </div>
      </button>
    </div>

  </aside>

  <!-- ================= ÁREA PRINCIPAL DE CHAT ================= -->
  <section class="flex-1 flex flex-col h-full bg-light-bg dark:bg-dark-bg">
    
    <!-- Encabezado del Canal Activo -->
    <header class="h-14 px-6 border-b border-light-border dark:border-dark-border flex items-center justify-between bg-light-surface dark:bg-dark-surface">
      <div class="flex items-center space-x-3">
        <span class="font-bold text-lg text-brand-600 dark:text-accent-400">#</span>
        <h3 class="font-semibold text-base text-slate-800 dark:text-slate-100">
          {{ activeChannel().name }}
        </h3>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-accent-500"></span>
        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">En línea</span>
      </div>
    </header>

    <!-- Lista de Mensajes / Burbujas -->
    <div class="flex-1 overflow-y-auto p-6 space-y-4">
      <div 
        *ngFor="let msg of messages" 
        class="flex flex-col"
        [class.items-end]="msg.isMe"
        [class.items-start]="!msg.isMe">
        
        <!-- Nombre del remitente -->
        <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 mb-1 px-1">
          {{ msg.sender }}
        </span>

        <!-- Burbuja -->
        <div 
          class="max-w-[70%] rounded-2xl px-4 py-3 shadow-sm text-sm leading-relaxed"
          [ngClass]="{
            'bg-brand-600 text-white rounded-br-none': msg.isMe,
            'bg-light-surface dark:bg-dark-surface border border-light-border dark:border-dark-border text-slate-800 dark:text-slate-100 rounded-bl-none': !msg.isMe
          }">
          <p>{{ msg.text }}</p>
        </div>

        <!-- Hora -->
        <span class="text-[10px] text-slate-400 dark:text-slate-500 mt-1 px-1">
          {{ msg.timestamp }}
        </span>
      </div>
    </div>

    <!-- Input Flotante / Inferior de Envío -->
    <footer class="p-4 bg-light-surface dark:bg-dark-surface border-t border-light-border dark:border-dark-border">
      <form (submit)="sendMessage(); $event.preventDefault()" class="flex items-center space-x-3 max-w-5xl mx-auto">
        <input 
          type="text" 
          [(ngModel)]="newMessage" 
          name="chatInput"
          placeholder="Escribe un mensaje en #{{ activeChannel().name }}..." 
          class="flex-1 bg-light-bg dark:bg-dark-bg border border-light-border dark:border-dark-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
        
        <button 
          type="submit" 
          class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-3 rounded-xl transition-all shadow-md font-medium text-sm flex items-center space-x-2">
          <span>Enviar</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </form>
    </footer>

  </section>

</div>
