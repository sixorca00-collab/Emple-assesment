# SPA de Angular: assets estaticos + fallback a index.html para el router del cliente
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # assets con hash en el nombre: cache larga
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # cualquier otra ruta la resuelve el router de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
