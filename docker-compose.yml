# docker compose up  ->  db + migrator (one-shot) + backend + frontend
# variables en .env (copiar de .env.example). Sin secretos en este archivo.
name: riwi-messaging

services:

  # --- PostgreSQL 15+ con pgvector (misma base para relacional y vectorial) ---
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # volumen nombrado: la base persiste entre `docker compose up`
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [riwi]

  # --- migrator: corre Flyway (V1..Vn) como superusuario + fija password del rol de app + carga el seed ---
  migrator:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      # SEED_FORCE=true recarga el corpus aunque ya haya datos (util para `docker compose run`)
      SEED_FORCE: ${SEED_FORCE:-false}
    depends_on:
      db:
        condition: service_healthy
    # one-shot: corre y termina; el backend espera su exito
    restart: "no"
    networks: [riwi]

  # --- backend Spring Boot: se conecta como riwi_app (sujeto a RLS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:14200}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SEARCH_TEXT_CONFIG: ${SEARCH_TEXT_CONFIG:-spanish}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.groq.com/openai/v1}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-openai/gpt-oss-120b}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      COPILOT_TOP_K: ${COPILOT_TOP_K:-6}
      COPILOT_MIN_SIMILARITY: ${COPILOT_MIN_SIMILARITY:-0.3}
      # en compose se re-embebe todo el corpus con el proveedor real al arrancar
      EMBEDDINGS_BACKFILL_ON_STARTUP: "true"
      EMBEDDINGS_BACKFILL_MODE: "all"
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SERVER_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [riwi]

  # --- frontend Angular servido por nginx con fallback SPA ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL del backend, resuelta en build-time (ver README). Debe coincidir con el puerto publicado del backend.
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks: [riwi]

volumes:
  db_data:

networks:
  riwi:
    driver: bridge
